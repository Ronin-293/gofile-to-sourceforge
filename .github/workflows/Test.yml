name: Mirror to SourceForge (Ultimate Stable)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Google Drive OR Direct Mirror Link"
        required: true
      sf_folder:
        description: "SourceForge folder name (must already exist)"
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tools
        run: |
          sudo apt update
          sudo apt install -y python3-pip sshpass aria2 rsync wget curl
          pip3 install gdown

      - name: Download File
        run: |
          echo "Starting download..."
          RAW_URL="${{ github.event.inputs.download_url }}"
          echo "URL: $RAW_URL"

          if echo "$RAW_URL" | grep -q "drive.google.com"; then
            echo "Google Drive detected"

            FILE_ID=$(echo "$RAW_URL" | sed -E 's#.*/d/([^/]+).*#\1#')
            if [ "$FILE_ID" = "$RAW_URL" ]; then
              FILE_ID=$(echo "$RAW_URL" | sed -E 's/.*id=([^&]+).*/\1/')
            fi

            if [ -z "$FILE_ID" ]; then
              echo "Invalid Google Drive link"
              exit 1
            fi

            gdown "https://drive.google.com/uc?id=$FILE_ID&confirm=t" --fuzzy

          else
            echo "Direct mirror detected"

            aria2c -x 16 -s 16 -k 1M \
              --file-allocation=none \
              --summary-interval=5 \
              --console-log-level=notice \
              "$RAW_URL"
          fi

          echo "Download complete"
          ls -lh

          FILE_NAME=$(ls *.zip 2>/dev/null | head -n 1 || true)

          if [ -z "$FILE_NAME" ]; then
            echo "No ZIP found"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$FILE_NAME")
          echo "Size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 500000000 ]; then
            echo "File too small — likely failed download"
            exit 1
          fi

          sha256sum "$FILE_NAME" > "$FILE_NAME.sha256"

          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          echo "SHA_FILE=$FILE_NAME.sha256" >> $GITHUB_ENV

      - name: Upload to SourceForge (rsync)
        run: |
          echo "Uploading via rsync..."

          DEST="/home/frs/project/${{ secrets.SF_PROJECT }}/${{ github.event.inputs.sf_folder }}/"

          sshpass -p "${{ secrets.SF_PASSWORD }}" rsync -avP \
            -e "ssh -o StrictHostKeyChecking=no" \
            "${{ env.FILE_NAME }}" \
            "${{ env.SHA_FILE }}" \
            ${{ secrets.SF_USER }}@frs.sourceforge.net:$DEST

          echo "Upload done"

      - name: Print Public Download Link
        run: |
          PUBLIC_LINK="https://sourceforge.net/projects/${{ secrets.SF_PROJECT }}/files/${{ github.event.inputs.sf_folder }}/${{ env.FILE_NAME }}/download"

          echo "Public Download Link:"
          echo "$PUBLIC_LINK"

      - name: Telegram Success
        if: success()
        run: |
          PUBLIC_LINK="https://sourceforge.net/projects/${{ secrets.SF_PROJECT }}/files/${{ github.event.inputs.sf_folder }}/${{ env.FILE_NAME }}/download"

          MESSAGE="✅ Upload Successful!

File: ${{ env.FILE_NAME }}
Folder: ${{ github.event.inputs.sf_folder }}

Download:
$PUBLIC_LINK"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="$MESSAGE"

      - name: Telegram Failure
        if: failure()
        run: |
          MESSAGE="❌ Upload Failed!

Check GitHub Actions logs."

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TG_CHAT_ID }} \
            -d text="$MESSAGE"
