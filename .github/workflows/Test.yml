name: Mirror to SourceForge (Pro)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: "Google Drive OR Direct Mirror Link"
        required: true

      sf_folder:
        description: "SourceForge folder name (e.g. Lunaris-AOSP)"
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Install Required Tools
        run: |
          sudo apt update
          sudo apt install -y python3-pip sshpass aria2 wget curl
          pip3 install gdown

      - name: Download File (GDrive or Mirror)
        run: |
          echo "Starting Download..."

          RAW_URL="${{ github.event.inputs.download_url }}"
          echo "Input URL: $RAW_URL"

          if echo "$RAW_URL" | grep -q "drive.google.com"; then
            echo "Google Drive link detected"

            FILE_ID=$(echo "$RAW_URL" | sed -E 's#.*/d/([^/]+).*#\1#')

            if [ "$FILE_ID" = "$RAW_URL" ]; then
              FILE_ID=$(echo "$RAW_URL" | sed -E 's/.*id=([^&]+).*/\1/')
            fi

            if [ -z "$FILE_ID" ]; then
              echo "ERROR: Invalid Google Drive link"
              exit 1
            fi

            gdown "https://drive.google.com/uc?id=$FILE_ID&confirm=t" --fuzzy

          else
            echo "Direct mirror link detected"

            aria2c -x 16 -s 16 -k 1M \
              --file-allocation=none \
              --summary-interval=5 \
              --console-log-level=notice \
              "$RAW_URL"
          fi

          echo "Listing downloaded files..."
          ls -lh

          FILE_NAME=$(ls *.zip 2>/dev/null | head -n 1 || true)

          if [ -z "$FILE_NAME" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$FILE_NAME")
          echo "Downloaded size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 500000000 ]; then
            echo "ERROR: File too small. Download likely failed."
            exit 1
          fi

          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV
          echo "File ready: $FILE_NAME"

      - name: Upload to SourceForge
        run: |
          echo "Uploading to SourceForge..."

          sshpass -p "${{ secrets.SF_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SF_USER }}@frs.sourceforge.net "mkdir -p /home/frs/project/${{ secrets.SF_PROJECT }}/${{ github.event.inputs.sf_folder }}"

          sshpass -p "${{ secrets.SF_PASSWORD }}" scp -o StrictHostKeyChecking=no \
          "${{ env.FILE_NAME }}" \
          ${{ secrets.SF_USER }}@frs.sourceforge.net:/home/frs/project/${{ secrets.SF_PROJECT }}/${{ github.event.inputs.sf_folder }}/

          echo "Upload complete"

      - name: Telegram Success Notification
        if: success()
        run: |
          MESSAGE="✅ Upload Successful!

          File: ${{ env.FILE_NAME }}
          Folder: ${{ github.event.inputs.sf_folder }}
          Project: ${{ secrets.SF_PROJECT }}"

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TG_CHAT_ID }} \
          -d text="$MESSAGE"

      - name: Telegram Failure Notification
        if: failure()
        run: |
          MESSAGE="❌ Upload Failed!

          Check GitHub Actions logs."

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TG_CHAT_ID }} \
          -d text="$MESSAGE"
